name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  app-macos:
    name: App (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write   # attach the zip to the release on v* tags
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count
      - run: swift --version
      - run: swift test
      - run: Scripts/package_app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AIUsage-zip
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
